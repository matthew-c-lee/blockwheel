name: Build and test
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x gradlew
      - run: ./gradlew build runGameTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blockwheel-build
          path: |
            build/libs/*.jar
            build/reports/
            build/test-results/
