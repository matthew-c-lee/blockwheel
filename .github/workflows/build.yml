name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      client_tests:
        description: Run the client and render integration suite with software OpenGL
        type: boolean
        default: false
      client_profile:
        description: Optional client compatibility profile
        type: choice
        options: [baseline, modmenu, tweakeroo]
        default: baseline

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
      - name: Derive artifact name from project properties
        id: metadata
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties | tr -d '\r')
          test -n "$version" && test -n "$minecraft"
          echo "name=blockwheel-${version}+mc${minecraft}" >> "$GITHUB_OUTPUT"
      - name: Build, unit tests and Fabric server GameTests
        run: ./gradlew --no-daemon --console=plain build runGameTest releaseArtifacts
      - name: Upload installable mod, sources and checksums
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.name }}
          path: build/release/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Preserve verification reports and failure logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: blockwheel-verification-${{ github.run_attempt }}
          path: |
            build/reports/
            build/test-results/
            build/**/logs/*.log*
            build/**/crash-reports/*.txt
            run*/logs/*.log*
            run*/crash-reports/*.txt
          if-no-files-found: warn
          retention-days: 14

  client-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.client_tests }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Install headless display and Mesa
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri libegl1 libglx-mesa0 libasound2t64 python3-venv
          python3 -m venv build/frame-tools
          build/frame-tools/bin/pip install Pillow
      - name: Run Fabric client GameTests at 1600 by 1000
        env:
          CLIENT_PROFILE: ${{ inputs.client_profile }}
        shell: bash
        run: |
          profile=()
          case "$CLIENT_PROFILE" in
            baseline) ;;
            modmenu) profile=(-PtestModMenu=true) ;;
            tweakeroo) profile=(-PtestTweakeroo=true) ;;
            *) exit 1 ;;
          esac
          xvfb-run -a -s '-screen 0 1600x1000x24' ./gradlew --no-daemon --console=plain runClientGameTest "${profile[@]}"
      - name: Verify captured radial and resource-pack frames
        shell: bash
        run: |
          for scale in 2 3 4; do
            for prefix in blockwheel-hotbar-reference blockwheel-hotbar-restored; do
              mapfile -t frames < <(find build/run/clientGameTest/screenshots -type f -name "*${prefix}-scale-${scale}.png")
              test "${#frames[@]}" -eq 1
              build/frame-tools/bin/python src/gametest/python/verify_radial_frames.py "${frames[0]}" --scale "$scale"
            done
            for resolution in 1 2; do
              mapfile -t frames < <(find build/run/clientGameTest/screenshots -type f -name "*blockwheel-hotbar-pack-${resolution}-scale-${scale}.png")
              test "${#frames[@]}" -eq 1
              build/frame-tools/bin/python src/gametest/python/verify_resource_pack_frames.py "${frames[0]}" --scale "$scale" --source-scale "$resolution"
            done
          done
      - name: Preserve client reports, screenshots and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: blockwheel-client-${{ inputs.client_profile }}-${{ github.run_attempt }}
          path: |
            build/reports/
            build/test-results/
            build/**/screenshots/*.png
            build/**/logs/*.log*
            build/**/crash-reports/*.txt
            run*/screenshots/*.png
            run*/logs/*.log*
            run*/crash-reports/*.txt
          if-no-files-found: warn
          retention-days: 14
